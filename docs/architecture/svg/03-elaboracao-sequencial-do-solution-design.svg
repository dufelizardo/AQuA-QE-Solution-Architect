tify_architecture_pattern</tspan><tspan x='610.0' dy='16.20'>(so entre os do catalogo)</tspan></text><text x='960.0' y='177.47' text-anchor='middle' font-size='11' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='960.0' dy='0.00'>GR-SA-1: padrao fora do</tspan><tspan x='960.0' dy='14.85'>catalogo -&gt; campo fica ""</tspan></text><text x='610.0' y='272.70' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='610.0' dy='0.00'>identify_components_and_integrations</tspan><tspan x='610.0' dy='16.20'>(componentes por camada do padrao + integracoes citadas)</tspan></text><text x='960.0' y='277.47' text-anchor='middle' font-size='11' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='960.0' dy='0.00'>GR-SA-2: integracao sem</tspan><tspan x='960.0' dy='14.85'>evidencia textual -&gt; lista vazia</tspan></text><text x='180.0' y='272.70' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='180.0' dy='0.00'>identify_candidate_integrations</tspan><tspan x='180.0' dy='16.20'>(sugestao de integracoes tipicas do dominio, rotulada como sugestao)</tspan></text><text x='610.0' y='369.60' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='610.0' dy='0.00'>identify_domain_model +</tspan><tspan x='610.0' dy='16.20'>identify_process_flows</tspan><tspan x='610.0' dy='16.20'>(entidades e fluxos, so se evidenciados)</tspan></text><text x='610.0' y='479.60' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='610.0' dy='0.00'>generate_non_functional_requirements +</tspan><tspan x='610.0' dy='16.20'>identify_technical_risks</tspan><tspan x='610.0' dy='16.20'>(NFR categorizado ISO/IEC 25010 + riscos)</tspan></text><text x='610.0' y='592.70' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='610.0' dy='0.00'>generate_ar